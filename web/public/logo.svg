<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" role="img" aria-label="CueClose">
  <title>CueClose</title>
  <defs>
    <style>
      .cue { fill: #00A859; }
      .close { fill: #002D5B; }
    </style>
  </defs>
  <!-- Interlocking C mark with integrated check -->
  <g transform="translate(80,18)">
    <!-- Outer green C -->
    <path class="cue" d="M96 12c-42 0-76 30-76 72s34 72 76 72c18 0 34-5 46-14l-14-18c-8 6-19 10-32 10-28 0-50-20-50-50s22-50 50-50c13 0 24 4 32 10l14-18C130 17 114 12 96 12z"/>
    <!-- Inner navy C -->
    <path class="close" d="M96 40c-26 0-46 18-46 44s20 44 46 44c12 0 22-3 30-9l-11-14c-5 3-11 5-19 5-14 0-24-9-24-26s10-26 24-26c8 0 14 2 19 5l11-14c-8-6-18-9-30-9z"/>
    <!-- Checkmark integrated from inner C opening -->
    <path class="cue" d="M108 92l18 18 42-54 16 12-58 74-34-34z"/>
  </g>
  <!-- Wordmark -->
  <text x="140" y="198" text-anchor="middle" font-family="Montserrat, Arial Black, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="0.5">
    <tspan class="cue">Cue</tspan><tspan class="close">Close</tspan>
  </text>
</svg>
